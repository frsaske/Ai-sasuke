name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          # Detect active Java major version
          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1)
          echo "Java version string: $JAVA_VER_STRING"
          
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect active Java major version."
            exit 1
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR"
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or higher. Detected: $JAVA_MAJOR"
            exit 1
          fi
          
          echo "Java environment verified successfully: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "Error: ./debug.keystore could not be verified after creation."
            exit 1
          fi

          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK."
            echo "Searching only inside app/build/outputs/apk directory:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK at $EXPECTED_APK is empty."
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: Expected debug APK does not have .apk extension."; exit 1 ;;
          esac
          
          echo "Verified APK exists and is valid: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          # Create temporary directory inside runner
          ASSET_DIR="$RUNNER_TEMP/release_asset"
          mkdir -p "$ASSET_DIR"

          # Sanitize repository name
          RAW_REPO="${{ github.repository }}"
          REPO_NAME=$(echo "${RAW_REPO##*/}" | tr -c 'a-zA-Z0-9_-' '-' | sed 's/^-*//;s/-*$//')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi

          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TARGET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$TARGET_PATH"

          if [ ! -f "$TARGET_PATH" ] || [ ! -s "$TARGET_PATH" ]; then
            echo "Error: Release asset preparation failed."
            exit 1
          fi

          echo "Prepared release asset: $TARGET_PATH"
          echo "asset_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Verify GitHub CLI
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is missing or empty at $ASSET_PATH."
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat <<'EOF'
### Debug APK Build

This is an automatically generated debug APK built by GitHub Actions.

- **Run Number:** #${{ github.run_number }}
- **Run Attempt:** ${{ github.run_attempt }}
- **Commit SHA:** `${{ github.sha }}`

> **Notice:** This APK is intended for testing and internal verification. It is signed with a temporary debug keystore and is not a Play Store production release.
EOF
          )
          
          echo "Creating release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully."
            
            RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            gh release view "$RELEASE_TAG" || true
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
### Debug APK Build & Release Succeeded

- **Release:** [$RELEASE_TITLE]($RELEASE_URL)
- **Tag:** \`$RELEASE_TAG\`
- **APK File:** \`$ASSET_NAME\`

You can download the APK directly from the **Assets** section of the [GitHub Release]($RELEASE_URL).

The standard GitHub Actions artifact (\`app-debug-apk\`) is also preserved and available in the run summary.
EOF
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "APK build succeeded and the artifact 'app-debug-apk' is preserved."
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
### ⚠️ Debug APK Build Succeeded (Release Publishing Warning)

The debug APK was built and verified successfully.

- **Artifact Name:** \`app-debug-apk\` (available for download in this Actions run)

*Note: GitHub Release publishing did not complete. Your built APK is safely stored in the Actions artifacts above.*
EOF
          fi
